<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Paper Radar{% endblock %}</title>
<meta name="description" content="New arXiv papers on anomaly detection, ranked by how close they are to research on abnormal water consumption. Updated every weekday.">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="New arXiv papers on anomaly detection, ranked by closeness to water-consumption research.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="{{ root }}favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}style.css?v={{ asset_version }}">
<link rel="alternate" type="application/rss+xml" title="Paper Radar" href="{{ root }}feed.xml">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ root or './' }}">
    <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><rect x="5" y="3" width="18" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M9 10h10M9 15h10M9 20h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".55"/><circle cx="23" cy="23" r="5" fill="var(--bg)" stroke="currentColor" stroke-width="2.5"/><path d="M26.5 26.5L30 30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <span>paper radar</span>
  </a>
  <nav class="site-nav">
    <a href="{{ root }}archive.html">Archive</a>
    <a href="{{ root }}about.html">How it works</a>
    <a href="{{ repo_url }}">GitHub</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="site-footer">
  <p>Paper metadata from the <a href="https://info.arxiv.org/help/api/index.html">arXiv API</a>. Thank you to arXiv for use of its open access interoperability. Abstracts belong to their authors.</p>
  <p>Updated automatically by GitHub Actions · <a href="{{ repo_url }}">Source</a> · <a href="{{ root }}feed.xml">RSS</a> · <a href="{{ root }}api/latest.json">JSON</a> · Ege Çelik</p>
</footer>
</body>
</html>
