[project]
name = "paper-radar"
version = "1.0.0"
description = "New arXiv papers ranked by how close they are to my research on water-consumption anomaly detection."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ege Çelik" }]
dependencies = [
    "fastembed>=0.5",
    "httpx>=0.28",
    "jinja2>=3.1",
    "numpy>=2.0",
]

[project.scripts]
paper-radar = "paper_radar.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/fakes.py" = ["E501"]  # a verbatim XML fixture

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
